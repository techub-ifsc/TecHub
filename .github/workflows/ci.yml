# Testes, build e auditoria de dependências em cada pull request e na main.
# Não roda no push de outras branches: ali a branch é testada sozinha, sem as
# correções que entraram na main depois, e o resultado confunde. No pull request
# o teste é feito sobre a junção da branch com a main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # 18 é a versão mais antiga em que a API pode rodar no deploy: uma dependência que
    # só funciona em Node novo derrubou a API em produção em 22/10, sem o CI perceber.
    strategy:
      matrix:
        node-version: [18, 22]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Os testes simulam o banco: estas variáveis só precisam existir.
      - run: npm test
        env:
          DB_USER: ci
          DB_PASSWORD: ci
          DB_NAME: ci
          DB_HOST: localhost
          JWT_SECRET: segredo-usado-apenas-nos-testes-do-ci
      # Falha se alguma dependência de produção tiver alerta alto ou crítico.
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
