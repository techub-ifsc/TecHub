# Testes, build e auditoria de dependências em cada push e pull request.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Os testes simulam o banco: estas variáveis só precisam existir.
      - run: npm test
        env:
          DB_USER: ci
          DB_PASSWORD: ci
          DB_NAME: ci
          DB_HOST: localhost
          JWT_SECRET: segredo-usado-apenas-nos-testes-do-ci
      # Falha se alguma dependência de produção tiver alerta alto ou crítico.
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
